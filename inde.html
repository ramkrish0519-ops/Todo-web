
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Todo List</title>

    <link rel="stylesheet" href="./index.css">
</head>
<body>

    <div class="container">

        <header>
<b><h1 style="color: rgb(22, 85, 117);">LevelUp 📝</h1></b>
<p><strong>“Master your time, build your career, strengthen your body, and become the best version of yourself.”</strong></p>        </header>

        <div class="input-section">
            <input
                type="text"
                id="taskinput"
                placeholder="Enter your task..."
            >
            <button id="addBtn">+ Add Task</button>
        </div>

        <div class="search-section">
            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search your tasks..."
            >
        </div>

        <div id="result"></div>

    </div>

    <script src="./index.js"></script>

</body>
</html>
